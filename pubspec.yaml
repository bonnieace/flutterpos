name: uzapay_pos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.13+8

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  get: ^4.6.5
  iconsax: ^0.0.8 
  crypto: ^3.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.0.7
  


  
  # save file
  device_info_plus: ^12.3.0
  file_picker: ^10.3.8
  permission_handler: ^12.0.1
  path_provider: ^2.0.1
  flutter_pdfview: ^1.3.2
  url_launcher: ^6.2.3
  intl: ^0.20.2
  toast: ^0.3.0 
  flutter_downloader: ^1.11.6
  package_info_plus: ^4.0.0
  connectivity_plus: ^5.0.2
  share_plus: ^12.0.1
  media_store_plus: ^0.1.3
  

  # open pdf document
  open_file: ^3.1.0
  webview_flutter: ^4.4.4

  #pdf_viewer_plugin: ^2.0.1 
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.3.6
  # No `firebase_app_check`, since 2026-09-28. Nothing enforces App Check,
  # and the provider it activated made every Firebase SDK wait for a token
  # before sending - long enough, on a real phone, to fail the launch read.
  # See test/dev/app_check_off_test.dart before adding it back.
  flutter_launcher_icons: ^0.14.4

  fl_chart: ^1.1.1
  printing: ^5.11.1
  pdf: ^3.10.0
  dio: ^5.4.0
  firebase_storage: ^13.0.4
  syncfusion_flutter_pdf: ^31.2.18
  # Pinned 2026-08-29: `any` let a transitive resolution decide the version a
  # release build shipped, so two builds of the same commit could differ.
  http: ^1.6.0
  audioplayers: ^5.2.1
  lottie: ^3.1.0
  flutter_esc_pos_network: ^1.0.3
  # Direct since 2026-09-03: `CheckoutPrinterTestPage` draws its own mark and
  # `Generator.imageRaster` takes an `image` `Image`. It was already here as a
  # transitive of `flutter_esc_pos_utils`; it is named now because a file of
  # ours imports it.
  image: ^4.3.0
  flutter_esc_pos_utils: ^1.0.1
  excel: ^4.0.6
  sentry_flutter: ^9.21.0
  flutter_svg: ^2.3.0
  flutter_typeahead: 6.0.0
  in_app_update: ^5.0.0
  material_symbols_icons: ^4.2960.0
  flutter_blue_classic: ^0.1.1
  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/
    # design.md §6.4's eight animated assets, sourced from LottieFiles' free tier
    # under the Lottie Simple License. Monochrome or line-art only, so one value
    # delegate tints them - a multi-coloured file is refused, which is the whole
    # of what makes an authored asset survive a palette change.
    - assets/lottie/
    # unDraw illustrations (MIT, no attribution). Sourced multi-colour, which
    # the Lottie note above would refuse - the difference is that these are
    # never drawn in the colours they ship with. `AppIllustration` binds each of
    # unDraw's five palette slots to a token role at render time, so the file on
    # disk is a shape and the palette is still `AppTokens`.
    - assets/illustrations/
    # Other apps' own icons, for the home tiles that send through them -
    # WhatsApp and Gmail - at the developer's direction on 2026-10-04. The one
    # place this app draws colours that are not its tokens: an app icon in
    # anybody else's palette is not that app's icon. WhatsApp's glyph is Simple
    # Icons' (CC0); Gmail's is the 2020 mark from Wikimedia Commons.
    - assets/app_icons/

  # Profound Verdant §typography, and `docs/stitch/OPEN_QUESTIONS.md` decision 20.
  # **The families changed on 2026-08-22**, from Roboto/Roboto Mono to Hanken
  # Grotesk and JetBrains Mono. The design names both, and the exported screens
  # link them from `fonts.googleapis.com` - which is exactly the thing an
  # offline-first till cannot do, so they are bundled rather than fetched.
  #
  # Only the weights the type roles actually read are declared. `AppTypeRoles`
  # asks for 400, 500, 600 and 700 of the interface face and 400 of the mono
  # face; 500 of the mono face is declared as well because Profound Verdant's
  # `data-mono` row is 500 and that repoint is the next question rather than
  # this change. No italic is declared, because no role asks for one.
  #
  # Both families are SIL OFL 1.1 and ship with their licences:
  # `fonts/HankenGrotesk-OFL.txt` and `fonts/JetBrainsMono-OFL.txt`. The Roboto
  # faces stay in `fonts/` undeclared - an undeclared file is not in the app,
  # and the screenshot harness no longer needs them either.
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: "AppIcon"
  image_path: "images/uzapay-app-icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#071610"

# Splash images, already generated into android/ and ios/. The package is not a
# dependency: the app never calls it, and Flutter puts every plugin - dev ones
# too - into the iOS build, where 2.4.4's Swift package is rejected by Xcode
# (2.4.5+ fixes it but needs archive 4, which excel 4.0.6 cannot share). To
# regenerate after changing this section:
#   dart pub global activate flutter_native_splash 2.4.4
#   dart pub global run flutter_native_splash:create
flutter_native_splash:
  color: "#071610"
  color_dark: "#071610"
  image: images/uzapay-mark.png
  image_dark: images/uzapay-mark.png

  android_12:
    color: "#071610"
    color_dark: "#071610"
    image: images/uzapay-android12.png
    image_dark: images/uzapay-android12.png

 
  web: true
