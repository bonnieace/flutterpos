<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock counts &#8212; phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
/* 411 x 891, the harness's mobile viewport. Measured against
   screenshots/mobile-full/16e-stock-counts.png and
   screenshots/mobile/16h-stock-counts-choice-open.png. */
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button, select { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; flex-wrap: wrap; gap: 32px; padding: 20px 24px 48px; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; max-width: 411px; text-align: center; line-height: 19px; }

.phone { position: relative; width: 411px; height: 891px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column; overflow: hidden; }
.bar { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: #071610; position: relative; z-index: 2; }
.bar button { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer; }
.bar span { font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.body { flex-grow: 1; min-height: 0; padding: 28px 20px 20px; display: flex; flex-direction: column; }
/* A screen scrolls; it does not squeeze. Nothing in the body shrinks to fit. */
.body > * { flex-shrink: 0; }
.al { margin-left: 4px; margin-right: 4px; }
h2 { margin: 0; font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }

.cards { display: flex; flex-direction: column; gap: 4px; }
.opt { margin: 4px; display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 12px; background: #0D1F16; border: 1px solid #283831; cursor: pointer; }
.opt-on { background: rgba(75, 226, 119, 0.10); border-color: #4BE277; box-shadow: inset 0 0 0 1px #4BE277; }
.radio { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; box-sizing: border-box; border-radius: 50%; border: 2px solid #869585; display: flex; align-items: center; justify-content: center; }
.opt-on .radio { border-color: #4BE277; }
.opt-on .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #4BE277; }
.opt-body { display: flex; flex-direction: column; min-width: 0; }
.opt-title { font-size: 16px; line-height: 24px; font-weight: 600; color: #D4E7DD; }
.opt-text { margin-top: 4px; font-size: 14px; line-height: 21px; color: #BCCBB9; }
.opt-till { margin-top: 8px; display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 16px; color: #869585; }
.opt-till svg { flex-shrink: 0; margin-top: 1px; }
.opt-till em { font-style: normal; color: #BCCBB9; }

/* Seven across: too narrow for the glyph beside the label, so it goes above. */
.week { display: flex; }
.day { flex: 1 1 0; min-width: 0; margin: 4px; height: 48px; box-sizing: border-box; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; background: #132A1F; border: 1px solid #3D4A3D; color: #D4E7DD; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.7px; cursor: pointer; }
.day-on { background: #4BE277; border-color: #4BE277; color: #003915; }

.rota-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.count { font-size: 12px; line-height: 16px; color: #869585; }
.callout { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 8px; background: rgba(242, 193, 78, 0.10); border: 1px solid rgba(242, 193, 78, 0.30); }
.callout svg { flex-shrink: 0; }
.callout-title { margin: 0; font-size: 18px; line-height: 28px; font-weight: 500; color: #D4E7DD; }
.callout-text { margin: 4px 0 0; font-size: 16px; line-height: 24px; color: #BCCBB9; }

.rota { margin: 0 4px; padding: 0; list-style: none; background: #0D1F16; border: 1px solid #283831; border-radius: 12px; }
.rota > li { position: relative; padding: 12px 16px; }
.rota > li + li { border-top: 1px solid #132A1F; }
.who { display: flex; align-items: center; gap: 12px; }
.av { width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; background: #132A1F; border: 2px solid; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; letter-spacing: 0.7px; color: #D4E7DD; }
.idn { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.line { display: flex; align-items: center; gap: 8px; }
.name { font-size: 16px; line-height: 24px; font-weight: 600; color: #D4E7DD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role { font-size: 12px; line-height: 16px; color: #869585; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 8px; background: #283831; border: 1px solid #3D4A3D; color: #BCCBB9; font-size: 14px; font-weight: 600; white-space: nowrap; }
.note { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; }
.note-att { color: #F2C14E; }
.note-info { color: #B0CDBD; }
/* Under the name, aligned with it: avatar 40 + space.12. */
.pick { position: relative; display: block; margin: 12px 4px 4px 56px; }
.pick select { display: block; appearance: none; -webkit-appearance: none; width: 100%; height: 48px; padding: 0 44px 0 48px; border-radius: 8px; background: #132A1F; border: 1px solid #3D4A3D; color: #D4E7DD; font-size: 16px; cursor: pointer; }
.pick .lead { position: absolute; left: 16px; top: 14px; pointer-events: none; color: #869585; }
.pick .drop { position: absolute; right: 12px; top: 12px; pointer-events: none; color: #BCCBB9; }

.when { margin: 0 4px; font-size: 12px; line-height: 16px; color: #869585; }
.save { margin: 4px; height: 48px; border: 0; border-radius: 8px; background: #4BE277; color: #003915; font-size: 14px; font-weight: 700; letter-spacing: 0.7px; cursor: pointer; }

/* AppSelect's own menu: surface.overlay, the current choice highlighted. */
.menu { position: absolute; z-index: 5; left: 29px; right: -12px; margin: 0; padding: 8px 0; list-style: none; background: #132A1F; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
.menu li { display: flex; align-items: center; height: 48px; padding: 0 16px; font-size: 16px; color: #D4E7DD; }
.menu li.on { background: rgba(212, 231, 221, 0.12); }
</style>
</head>

    </div>
    <div style="height: 24px;"></div>
    <h2 class="al" id="p-days">Which days</h2>
    <div style="height: 12px;"></div>
    <div class="week" role="group" aria-labelledby="p-days">
      <button type="button" class="day day-on" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Mon</button>
      <button type="button" class="day" aria-pressed="false">Tue</button>

    <div class="rota-head al"><h2>Who counts what</h2><span class="count">4 of 6 categories counted</span></div>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="#F2C14E" aria-hidden="true"><path d="M12 5.99 19.53 19H4.47L12 5.99M2.74 18c-.77 1.33.19 3 1.73 3h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18zM11 11v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zm0 5h2v2h-2z"></path></svg>
      <div>
        <p class="callout-title">Two categories will not be counted</p>
        <p class="callout-text">Nobody is down for Fasteners, and Plumbing is down to David Mutiso, who is deactivated and cannot sign in to count it.</p>
      </div>
    </div>
  </div>
</div>
<figcaption>The top of the screen &#8212; 411. All three choices on screen at once; the chip strip scrolled <em>Hold the register</em> out of view at this width. The days stack their glyph above the label.</figcaption>
</figure>
