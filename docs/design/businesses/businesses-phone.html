<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My businesses &#8212; phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap">
<style>
/* 411 x 891, the harness's mobile viewport. Screen colours are
   AppTokens.profoundVerdant; the receipts use the paper tokens
   (paperWhite, paperInk, paperMutedInk, paperRule, paperGreen) that
   generated documents already sit on. */
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button, select, input { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; flex-wrap: wrap; gap: 32px; padding: 20px 24px 48px; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; max-width: 411px; text-align: center; line-height: 19px; }
figcaption b { color: #BCCBB9; font-weight: 600; }
figcaption em { font-style: normal; color: #4BE277; }

.phone { position: relative; width: 411px; height: 891px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column; overflow: hidden; }
.bar { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px; }
.bar button { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer; }
.bar span { font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.body { flex-grow: 1; min-height: 0; padding: 8px 20px 24px; display: flex; flex-direction: column; overflow: hidden; }
.body > * { flex-shrink: 0; }
.gap4 { height: 4px; } .gap8 { height: 8px; } .gap12 { height: 12px; } .gap16 { height: 16px; } .gap20 { height: 20px; } .gap24 { height: 24px; }

/* The list's own header: what is here, and the one way to add to it. */
.head { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.head-text { flex-grow: 1; min-width: 0; padding-left: 4px; }
.head-title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: #D4E7DD; }
.head-sub { margin: 0; font-size: 12px; line-height: 16px; color: #869585; }

/* AppButton. */
.btn { height: 48px; box-sizing: border-box; padding: 0 16px; margin: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.7px; cursor: pointer; white-space: nowrap; }
.btn-pri { background: #4BE277; color: #003915; border: 0; }
.btn-sec { background: #132A1F; color: #D4E7DD; border: 1px solid #3D4A3D; }
.btn-ter { background: transparent; color: #4BE277; border: 0; }
.btn-off { background: #1E3A2B; color: #5D7468; border: 0; cursor: default; }
.btn-wide { flex: 1 1 0; }
.row { display: flex; align-items: center; }

/* A business, drawn as the receipt it prints. The whole slip is one
   PressSurface, so it sits 4 in from the 20 inset. */
.slip { position: relative; display: block; width: calc(100% - 8px); margin: 0 4px; padding: 0; border: 0; text-align: left; background: transparent; cursor: pointer; filter: drop-shadow(0 4px 12px rgba(3, 17, 11, 0.55)); }
.paper { position: relative; background: #FFFFFF; color: #141A16; border-radius: 8px 8px 0 0; padding: 20px 20px 24px; font-family: 'JetBrains Mono', ui-monospace, monospace;
  /* The torn edge: 8 deep, 16 apart. */
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
          mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%; }
.r-logo { display: flex; justify-content: center; color: #141A16; }
.r-name { margin: 0; text-align: center; font-size: 16px; line-height: 24px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
.r-slogan { margin: 0; text-align: center; font-size: 12px; line-height: 16px; color: #4A554E; }
.r-rule { margin: 12px 0; height: 0; border: 0; border-top: 1px dashed #D4DCD7; }
.r-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 20px; color: #4A554E; }
.r-line b { font-weight: 700; color: #141A16; white-space: nowrap; }
.r-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; line-height: 16px; color: #4A554E; }
.r-total b { font-size: 22px; line-height: 30.8px; font-weight: 800; color: #141A16; }
.r-foot { margin: 0; text-align: center; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1px; color: #141A16; text-transform: uppercase; }
.r-foot span { color: #4A554E; font-weight: 500; letter-spacing: 0; text-transform: none; }

/* The stamp: status in a word, as a receipt carries PAID. paperGreen ink. */
.stamp { position: absolute; top: 16px; right: 16px; transform: rotate(8deg); padding: 2px 8px; border: 2px solid #25AB2E; border-radius: 4px; color: #25AB2E; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }

/* AppSheet over surface.scrim. */
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 3; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; box-sizing: border-box; background: #132A1F; border-radius: 12px 12px 0 0; padding: 12px 20px 16px; display: flex; flex-direction: column; }
.handle { width: 32px; height: 4px; border-radius: 999px; background: #3D4A3D; align-self: center; }
.sheet-head { display: flex; align-items: center; min-height: 48px; }
.sheet-title { flex-grow: 1; margin: 0 0 0 4px; font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.close { width: 48px; height: 48px; border: 0; border-radius: 8px; background: transparent; color: #D4E7DD; display: flex; align-items: center; justify-content: center; }
.f { margin: 0 4px; }
.f-label { display: block; margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #BCCBB9; }
.input { height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 8px; background: #071610; border: 1px solid #3D4A3D; color: #D4E7DD; font-size: 16px; line-height: 24px; }
.input-focus { border: 2px solid #4BE277; padding: 0 15px; }
.input .grow { flex-grow: 1; }
.input svg { flex-shrink: 0; color: #BCCBB9; }
.caret { display: inline-block; width: 2px; height: 20px; background: #4BE277; margin-left: 1px; vertical-align: -4px; }
.help { margin: 8px 0 0; font-size: 12px; line-height: 16px; color: #869585; }
/* The preview is a slip at 0.8, on the sheet's own ground. */
/* AppSheet's masthead, as the product photo sheet uses it: the receipt fills
   the top of the sheet edge to edge under its rounded corners, with the
   handle and close laid over it and no heading. Its torn edge is the
   masthead's bottom, so the sheet's own ground shows through the teeth. */
.sheet-mast { padding: 0; overflow: hidden; }
.mast { position: relative; flex-shrink: 0; }
.mast .paper { border-radius: 0; padding: 56px 24px 32px; }
.mast .r-name { font-size: 22px; line-height: 30.8px; }
.mast-handle { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 4px; border-radius: 999px; background: rgba(0, 0, 0, 0.12); z-index: 1; }
.mast-handle span { display: block; width: 32px; height: 4px; border-radius: 999px; background: #3D4A3D; }
.mast-close { position: absolute; top: 4px; right: 8px; z-index: 1; width: 48px; height: 48px; border-radius: 8px; background: #132A1F; border: 0; display: flex; align-items: center; justify-content: center; color: #D4E7DD; }
.sheet-rows { padding: 16px 20px 16px; display: flex; flex-direction: column; }
</style>
</head>

<figcaption><b>Two businesses.</b> <em>My businesses</em> opens from its home tile and from the business name in the top bar. Each business is drawn as the receipt it prints: its logo, name and slogan, then its figures. The open one is stamped <em>OPEN NOW</em> and shows today, including who has the till open. Any other business shows its last counted day, with the date printed, because only the open business has live totals. <em>Add business</em> sits next to the count it adds to.</figcaption>
</figure>
