<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings &#8212; phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; gap: 32px; padding: 20px 24px 48px; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; }
.row { display: flex; align-items: flex-start; gap: 12px; width: 100%; box-sizing: border-box; padding: 14px; background: #0D1F16; border: 1px solid #283831; border-radius: 12px; text-align: left; cursor: pointer; }
.row-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #132A1F; border: 1px solid #283831; display: flex; align-items: center; justify-content: center; color: #BCCBB9; }
.row-body { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.row-title { font-size: 15px; font-weight: 600; color: #D4E7DD; }
.row-value { font-size: 13px; line-height: 19px; color: #869585; }
.row-note { font-size: 13px; line-height: 19px; color: #BCCBB9; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.badge-problem { background: rgba(147, 0, 10, 0.20); border: 1px solid rgba(239, 68, 68, 0.30); color: #EF4444; }
.badge-await { background: rgba(242, 193, 78, 0.10); border: 1px solid rgba(242, 193, 78, 0.30); color: #F2C14E; }
.chev { flex-shrink: 0; color: #869585; margin-top: 12px; }
</style>
</head>
<body>
<nav class="page-nav"><a href="index.html">&#8592; All Settings artboards</a></nav>
<div class="page-stage">

<figure>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column;">

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; border-bottom: 1px solid #283831;">
    <button type="button" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span style="font-size: 22px; font-weight: 700; color: #D4E7DD;">Settings</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px;">

    <section style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 12px; background: rgba(147, 0, 10, 0.20); border: 1px solid rgba(239, 68, 68, 0.30);">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"></path><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <p style="margin: 0; font-size: 15px; line-height: 21px; font-weight: 600; color: #D4E7DD;">No sale can be rung up on any device.</p>
          <p style="margin: 0; font-size: 13px; line-height: 19px; color: #BCCBB9;">This business has published no currency, so the till has nothing to price with.</p>
        </div>
      </div>
      <button type="button" style="width: 100%; height: 48px; border: 0; border-radius: 12px; background: #4BE277; color: #003915; font-size: 15px; font-weight: 600; cursor: pointer;">Set the currency</button>
    </section>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">

      <li><button type="button" class="row">
        <span class="row-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"></path><path d="M3 9h18v11H3z"></path><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"></path></svg></span>
        <span class="row-body">
          <span class="row-title">Business details</span>
          <span class="row-value">Mwangi Hardware &middot; logo set</span>
        </span>
        <span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button></li>

      <li><button type="button" class="row" style="border-color: rgba(239, 68, 68, 0.30);">
        <span class="row-icon" style="border-color: rgba(239, 68, 68, 0.30); color: #EF4444;" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 12h.01"></path><path d="M18 12h.01"></path></svg></span>
        <span class="row-body">
          <span class="row-title">Currency</span>
          <span class="badge badge-problem"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"></path><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>Not published</span>
          <span class="row-note">No sale can be rung up on any device.</span>
        </span>
        <span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button></li>

      <li><button type="button" class="row">
        <span class="row-icon" style="border-color: rgba(242, 193, 78, 0.30); color: #F2C14E;" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6"></path><path d="M7 19H5a2 2 0 01-2-2v-5a2 2 0 012-2h14a2 2 0 012 2v5a2 2 0 01-2 2h-2"></path><path d="M7 15h10v6H7z"></path></svg></span>
        <span class="row-body">
          <span class="row-title">Printer</span>
          <span class="badge badge-await"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Not set up</span>
          <span class="row-note">Receipts are not sent anywhere. Sales are still recorded.</span>
        </span>
        <span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button></li>

      <li><button type="button" class="row">
        <span class="row-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v3H9z"></path><path d="M15 5h2a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h2"></path><path d="M9 12h6"></path><path d="M9 16h4"></path></svg></span>
        <span class="row-body">
          <span class="row-title">Stock counts</span>
          <span class="row-value">Ask at the register &middot; Mon, Thu &middot; 4 people</span>
        </span>
        <span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button></li>

    </ul>

    <p style="margin: 2px 0 0; font-size: 12px; line-height: 18px; color: #869585;">Only an owner or an administrator sees these.</p>

  </div>
</div>
<figcaption>The index &#8212; 390</figcaption>
</figure>

<figure>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column;">

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; border-bottom: 1px solid #283831;">
    <button type="button" aria-label="Back to settings" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span style="font-size: 22px; font-weight: 700; color: #D4E7DD;">Currency</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 16px;">

    <section style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 12px; background: rgba(147, 0, 10, 0.20); border: 1px solid rgba(239, 68, 68, 0.30);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"></path><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #D4E7DD;">This business has published no currency, so no sale can be rung up on any device yet.</p>
    </section>

    <p style="margin: 0; font-size: 14px; line-height: 21px; color: #BCCBB9;">The code is recorded on every sale priced with it and labels every reported figure. It converts nothing: this app runs no exchange rate, and no recorded sale is ever re-priced.</p>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="cur" style="font-size: 13px; font-weight: 600; color: #BCCBB9;">ISO 4217 currency code</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-radius: 12px; background: #132A1F; border: 1px solid #283831;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#869585" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
        <input id="cur" type="text" value="KES" maxlength="3" style="flex-grow: 1; min-width: 0; height: 54px; border: 0; background: transparent; color: #D4E7DD; font-size: 17px; font-weight: 600; letter-spacing: 2px; outline: none;">
        <span style="font-size: 13px; color: #869585;">3 / 3</span>
      </div>
      <span style="font-size: 12px; line-height: 18px; color: #869585;">Three letters, such as KES, UGX, or TZS.</span>
    </div>

    <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 12px; background: #4BE277; color: #003915; font-size: 16px; font-weight: 600; cursor: pointer;">Publish</button>

  </div>
</div>
<figcaption>One setting open &#8212; 390</figcaption>
</figure>

</div>
</body>
</html>
