<style>
/* 411 x 891, the harness's mobile viewport. Measured against
   screenshots/mobile-full/36e-printer-bluetooth-found.png and
   screenshots/mobile/36f-printer-bluetooth-in-use.png. Non-pressable boxes sit
   at the 20 inset; buttons, fields and rows 4 further in, in PressSurface's
   focus-ring gutter, as the build draws them. */
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button, select { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; flex-wrap: wrap; gap: 32px; padding: 20px 24px 48px; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; max-width: 411px; text-align: center; line-height: 19px; }
figcaption b { color: #BCCBB9; font-weight: 600; }

.phone { position: relative; width: 411px; height: 891px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column; overflow: hidden; }
.bar { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: #071610; position: relative; z-index: 2; }
.bar button { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer; }
.bar span { font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.body { flex-grow: 1; min-height: 0; padding: 28px 20px 20px; display: flex; flex-direction: column; }
.body > * { flex-shrink: 0; }
.scrolled { padding-top: 0; justify-content: flex-end; }
.al { margin-left: 4px; margin-right: 4px; }
.gap4 { height: 4px; } .gap8 { height: 8px; } .gap12 { height: 12px; } .gap16 { height: 16px; } .gap24 { height: 24px; }

/* AppTabs: labelLarge, text.secondary to text.primary, a 2px indicator. */
.tabs { display: flex; border-bottom: 1px solid #132A1F; }
.tab { flex: 1 1 0; height: 48px; border: 0; padding: 0; background: transparent; display: flex; justify-content: center; color: #BCCBB9; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.7px; cursor: pointer; }
.tab span { position: relative; display: flex; align-items: center; height: 48px; }
.tab-on { color: #D4E7DD; }
.tab-on span::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #4BE277; }

/* Disclosure: info glyph, body 16/24, chevron. */
.disc { display: flex; align-items: center; gap: 8px; padding: 8px; margin: 0 4px; border-radius: 4px; color: #D4E7DD; font-size: 16px; line-height: 24px; }
.disc .grow { flex-grow: 1; }

h2 { margin: 0; font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.hint { margin: 0; font-size: 14px; line-height: 21px; color: #BCCBB9; }
.label { font-size: 14px; line-height: 20px; font-weight: 600; color: #BCCBB9; display: flex; justify-content: space-between; }
.label span:last-child { color: #869585; font-weight: 400; }

/* AppButton, lg. */
/* AppActionRow: s12 between actions, so 20 between two buttons' faces
   once each stands in its 4px gutter. */
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row-end { justify-content: flex-end; }
.btn { height: 48px; box-sizing: border-box; padding: 0 16px; margin: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.7px; cursor: pointer; }
.btn-pri { background: #4BE277; color: #003915; border: 0; }
.btn-sec { background: #132A1F; color: #D4E7DD; border: 1px solid #3D4A3D; }
.btn-des { background: transparent; color: #EF4444; border: 1px solid #EF4444; }
.btn-off { background: #1E3A2B; color: #5D7468; border: 0; cursor: default; }
.btn-wide { flex: 1 1 0; }

/* StatusBadge: 24 tall, radius.md, labelMedium, 14 glyph. */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 8px; border: 1px solid; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; }
.b-ok { background: rgba(75, 226, 119, 0.10); border-color: rgba(75, 226, 119, 0.30); color: #4BE277; }
.b-neu { background: #283831; border-color: #3D4A3D; color: #BCCBB9; }
.b-info { background: rgba(176, 205, 189, 0.10); border-color: rgba(176, 205, 189, 0.30); color: #B0CDBD; }

/* Callout: radius.md, 16 in, 18 glyph, the density body in text.secondary. */
.callout { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 8px; border: 1px solid; }
.callout svg { flex-shrink: 0; margin-top: 3px; }
.callout p { margin: 0; font-size: 16px; line-height: 24px; color: #BCCBB9; }
.c-info { background: rgba(176, 205, 189, 0.10); border-color: rgba(176, 205, 189, 0.30); }
.c-att { background: rgba(242, 193, 78, 0.10); border-color: rgba(242, 193, 78, 0.30); }

/* AppCard. */
.card { background: #0D1F16; border: 1px solid #283831; border-radius: 12px; padding: 16px; }
.dest-head { display: flex; align-items: flex-start; gap: 8px; }
.dest-head > div { flex-grow: 1; min-width: 0; }
.dest-name { font-size: 18px; line-height: 28px; font-weight: 500; color: #D4E7DD; }
.dest-sub { margin-top: 4px; font-size: 14px; line-height: 21px; color: #BCCBB9; }
.dest-line { margin: 8px 0 0; font-size: 14px; line-height: 21px; color: #BCCBB9; }

/* The device list: one card, rows on PressSurface, a chevron to the sheet. */
.list { margin: 0; padding: 0; list-style: none; background: #0D1F16; border: 1px solid #283831; border-radius: 12px; }
.list > li + li { border-top: 1px solid #132A1F; }
.dev { display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 12px 8px 12px 16px; cursor: pointer; }
.well { width: 40px; height: 40px; flex-shrink: 0; border-radius: 8px; background: #071610; display: flex; align-items: center; justify-content: center; color: #869585; }
.well-on { color: #4BE277; }
.dev-body { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
.dev-name { font-size: 16px; line-height: 24px; font-weight: 600; color: #D4E7DD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-sub { font-size: 12px; line-height: 16px; color: #869585; }
.dev-sub em { font-style: normal; color: #4BE277; }
.chev { flex-shrink: 0; color: #869585; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }

/* AppSheet at its half detent over surface.scrim. */
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 3; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 624px; z-index: 4; box-sizing: border-box; background: #132A1F; border-radius: 12px 12px 0 0; padding: 12px 20px 20px; display: flex; flex-direction: column; }
.sheet > * { flex-shrink: 0; }
.handle { width: 32px; height: 4px; border-radius: 999px; background: #3D4A3D; align-self: center; }
.sheet-title { margin: 0; font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.sheet-sub { margin: 4px 0 0; font-size: 14px; line-height: 21px; color: #BCCBB9; }

/* AppSelect and the cutter row. On the sheet the field and the overlay are
   the same surface; the border is what draws the field. */
.field-label { margin: 0 4px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #BCCBB9; }
.select { position: relative; margin: 0 4px; }
.select select { display: block; appearance: none; -webkit-appearance: none; width: 100%; height: 48px; padding: 0 44px 0 16px; border-radius: 8px; background: #132A1F; border: 1px solid #3D4A3D; color: #D4E7DD; font-size: 16px; cursor: pointer; }
.select svg { position: absolute; right: 12px; top: 12px; pointer-events: none; color: #BCCBB9; }
.check { display: flex; align-items: center; justify-content: space-between; min-height: 56px; color: #D4E7DD; font-size: 16px; line-height: 24px; }
/* The app's checkbox theme: 1px border.strong over surface.field, radius.sm. */
.box { width: 18px; height: 18px; box-sizing: border-box; border: 1px solid #3D4A3D; background: #132A1F; border-radius: 2px; margin-right: 11px; }

/* AppSnackBar: surface.overlay under the status container, 16 off every edge. */
.snack { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 5; border-radius: 8px; background: #132A1F; }
.snack > div { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 8px; border: 1px solid rgba(75, 226, 119, 0.30); background: rgba(75, 226, 119, 0.10); color: #D4E7DD; font-size: 16px; line-height: 24px; }
.snack svg { flex-shrink: 0; margin-top: 3px; }
</style>
