<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports &#8212; Day, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; align-items: flex-start; gap: 32px; padding: 20px 24px 48px; flex-wrap: wrap; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; max-width: 390px; text-align: center; line-height: 19px; }
.card { box-sizing: border-box; width: 100%; padding: 16px; background: #0D1F16; border: 1px solid #283831; border-radius: 12px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-title { font-size: 14px; font-weight: 600; color: #BCCBB9; letter-spacing: 0.1px; flex-grow: 1; }
.expand { width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; border: 1px solid #283831; background: #132A1F; color: #BCCBB9; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pill { height: 48px; flex-shrink: 0; padding: 0 20px; border-radius: 24px; border: 1px solid #283831; background: #0D1F16; color: #BCCBB9; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; }
.pill[aria-selected="true"] { background: #4BE277; border-color: #4BE277; color: #003915; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.badge-device { background: rgba(242, 193, 78, 0.10); border: 1px solid rgba(242, 193, 78, 0.30); color: #F2C14E; }
.figure-xl { font-size: 38px; line-height: 42px; font-weight: 800; letter-spacing: -0.9px; color: #D4E7DD; }
.figure-m { font-size: 22px; line-height: 26px; font-weight: 700; color: #D4E7DD; }
.sub { font-size: 13px; line-height: 19px; color: #869585; }
.note { font-size: 13px; line-height: 19px; color: #BCCBB9; }
.tender-row { display: flex; align-items: center; gap: 10px; }
.tender-name { font-size: 13px; color: #BCCBB9; width: 62px; flex-shrink: 0; }
.tender-track { flex-grow: 1; height: 8px; border-radius: 4px; background: #132A1F; overflow: hidden; }
.tender-fill { display: block; height: 100%; border-radius: 4px; }
.tender-amt { font-size: 13px; font-weight: 600; color: #D4E7DD; width: 74px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<nav class="page-nav"><a href="index.html">&#8592; All Reports artboards</a></nav>
<div class="page-stage">

<figure>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; border-bottom: 1px solid #283831;">
    <button type="button" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span style="font-size: 22px; font-weight: 700; color: #D4E7DD; flex-grow: 1;">Reports</span>
    <button type="button" aria-label="Download this report" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #D4E7DD; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>
    </button>
  </div>

  <div role="tablist" aria-label="Report" style="flex-shrink: 0; display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;">
    <button type="button" role="tab" aria-selected="true" class="pill">Day</button>
    <button type="button" role="tab" aria-selected="false" class="pill">Week</button>
    <button type="button" role="tab" aria-selected="false" class="pill">Month</button>
    <button type="button" role="tab" aria-selected="false" class="pill">Profit</button>
    <button type="button" role="tab" aria-selected="false" class="pill" style="margin-right: 16px;">Stock</button>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 12px;">
    <button type="button" aria-label="Previous day" style="width: 48px; height: 48px; border: 0; background: transparent; color: #BCCBB9; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span style="flex-grow: 1; text-align: center; font-size: 15px; font-weight: 600; color: #D4E7DD;">Today &middot; Sat 21 Sep</span>
    <button type="button" aria-label="Next day" disabled style="width: 48px; height: 48px; border: 0; background: transparent; color: #3D4A3D; cursor: not-allowed; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px;">

    <section class="card">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span class="card-title" style="flex-grow: 0;">Takings</span>
        <span class="figure-xl">KES 48,250<span style="font-size: 22px; font-weight: 700; color: #869585;">.00</span></span>
        <span class="badge badge-device" style="align-self: flex-start;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
          Counted on this phone
        </span>
        <p class="note" style="margin: 0;">Today has not been reconciled yet, so this is what this device can add up &#8212; its own sales, and anything still waiting to send. A second till&#8217;s sales are not in it.</p>
        <div style="display: flex; gap: 20px; padding-top: 12px; margin-top: 2px; border-top: 1px solid #283831;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span class="sub">After returns</span>
            <span style="font-size: 17px; font-weight: 700; color: #D4E7DD;">KES 46,900.00</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span class="sub">Average sale</span>
            <span style="font-size: 17px; font-weight: 700; color: #D4E7DD;">KES 623.00</span>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="card-title">How it was paid</span>
        <button type="button" class="expand" aria-label="Open payment breakdown">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="tender-row"><span class="tender-name">M-Pesa</span><span class="tender-track"><span class="tender-fill" style="width: 64%; background: #4BE277;"></span></span><span class="tender-amt">30,880</span></div>
        <div class="tender-row"><span class="tender-name">Cash</span><span class="tender-track"><span class="tender-fill" style="width: 29%; background: #2FA85A;"></span></span><span class="tender-amt">13,990</span></div>
        <div class="tender-row"><span class="tender-name">Card</span><span class="tender-track"><span class="tender-fill" style="width: 7%; background: #1C6B39;"></span></span><span class="tender-amt">3,380</span></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="card-title">Across the day</span>
        <button type="button" class="expand" aria-label="Open shift history">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 10px; height: 92px;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <span class="sub" style="font-size: 12px;">18,400</span>
          <div style="width: 100%; height: 52px; border-radius: 8px; background: #2FA85A;"></div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <span class="sub" style="font-size: 12px;">21,700</span>
          <div style="width: 100%; height: 62px; border-radius: 8px; background: #2FA85A;"></div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <span class="sub" style="font-size: 12px;">8,150</span>
          <div style="width: 100%; height: 24px; border-radius: 8px; background: #132A1F; border: 2px solid #4BE277; box-sizing: border-box;"></div>
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px solid #283831;">
        <span class="sub" style="flex: 1; text-align: center;">Asha<br>6a&#8211;1p</span>
        <span class="sub" style="flex: 1; text-align: center;">Juma<br>1p&#8211;6p</span>
        <span class="sub" style="flex: 1; text-align: center; color: #D4E7DD;">Grace<br>6p, still open</span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="card-title">Profit</span>
        <button type="button" class="expand" aria-label="Open profit report">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span class="figure-m">KES 12,180.00</span>
        <span class="badge badge-device" style="align-self: flex-start;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
          At least this much
        </span>
        <p class="note" style="margin: 0;">4 of the 78 lines sold today carry no cost, so the true figure is higher than this one. How much higher is not known.</p>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="card-title">Came back</span>
        <button type="button" class="expand" aria-label="Open returns">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span class="figure-m">KES 1,350.00</span>
        <span class="sub">across 3 returns</span>
      </div>
    </section>

  </div>
</div>
<figcaption>Day, on today. The figure says it was counted here, because today is normally unreconciled and a second till&#8217;s sales are not in it.</figcaption>
</figure>

</div>
</body>
</html>
