<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs &#8212; desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
/* 1280 wide. Toolbar 56, title at 16. The reading column is 720 (AppContentWidth.reading),
   centred. Body content is drawn as built, from screenshots/web/36g-printer-network-with-
   bluetooth-in-use.png and the Configs captures - only the strip is redesigned. */
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #D4E7DD; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 20px 24px 48px; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; max-width: 760px; text-align: center; line-height: 19px; }
figcaption b { color: #BCCBB9; font-weight: 600; }

.screen { position: relative; width: 1280px; height: 720px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column; overflow: hidden; }
.bar { height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; }
.bar span { font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.col { width: 720px; margin: 0 auto; display: flex; flex-direction: column; }
.inset { padding: 0 20px; display: flex; flex-direction: column; }
svg.g { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }
svg.g24 { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; }

/* ---- Two tabs: the switch. From 768 up each half is the wider label + space.24 a side. ---- */
.sw { position: relative; display: inline-flex; align-self: flex-start; height: 48px; border-radius: 999px; background: #0D1F16; box-shadow: inset 0 0 0 1px #132A1F; }
.seg { position: relative; flex: 0 0 auto; height: 48px; box-sizing: border-box; margin: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #BCCBB9; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; cursor: pointer; outline: none; }
.seg::before { content: ''; position: absolute; inset: 4px; border-radius: 999px; background: transparent; }
.seg.is-on { color: #D4E7DD; }
.seg.is-on::before { background: #283831; box-shadow: inset 0 0 0 1px #3D4A3D; }
.seg:not(.is-on):hover::before, .seg.is-hover:not(.is-on)::before { background: rgba(212, 231, 221, 0.08); }
.seg:not(.is-on):active::before { background: rgba(212, 231, 221, 0.12); }
.seg:focus-visible::after { content: ''; position: absolute; inset: 0; border: 2px solid #4BE277; border-radius: 999px; z-index: 2; }
.seg .lbl { position: relative; z-index: 1; display: block; }

/* ---- Three or more: icon tabs ---- */
.it { position: relative; display: flex; height: 48px; box-shadow: inset 0 -1px 0 #132A1F; }
.it.page { padding: 0 8px; }
.itab { position: relative; flex: 0 0 auto; height: 48px; box-sizing: border-box; margin: 0; padding: 0 12px; border: 0; background: transparent; display: flex; align-items: center; color: #869585; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; cursor: pointer; outline: none; }
.itab::before { content: ''; position: absolute; inset: 4px; border-radius: 8px; background: transparent; }
.itab:hover, .itab:active { color: #BCCBB9; }
.itab:hover::before { background: rgba(212, 231, 221, 0.08); }
.itab:active::before { background: rgba(212, 231, 221, 0.12); }
.itab.is-on, .itab.is-on:hover { color: #4BE277; }
.itab:focus-visible::after, .itab.is-focus::after { content: ''; position: absolute; inset: 0; border: 2px solid #4BE277; border-radius: 12px; z-index: 2; }
.itab .c { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
.itab .c svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.itab.is-on .c::after { content: ''; position: absolute; left: 0; right: 0; bottom: -14px; height: 2px; border-radius: 2px 2px 0 0; background: #4BE277; }

/* ---- Body content, as built ---- */
.disc { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-top: 12px; color: #D4E7DD; font-size: 16px; line-height: 24px; }
.disc .grow { flex-grow: 1; }
.disc svg { color: #BCCBB9; }
.callout { display: flex; gap: 12px; padding: 16px; background: #13231B; border: 1px solid #3D4A3D; border-radius: 8px; color: #BCCBB9; font-size: 16px; line-height: 24px; }
.callout span { color: #D4E7DD; }
.flabel { margin: 0 4px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #BCCBB9; }
.field { margin: 0 4px; height: 48px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #132A1F; border: 1px solid #3D4A3D; border-radius: 8px; font-size: 16px; color: #D4E7DD; }
.field svg { color: #869585; }
.field .grow { flex-grow: 1; }
.check-row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; font-size: 16px; color: #D4E7DD; }
.box { width: 18px; height: 18px; box-sizing: border-box; border: 2px solid #3D4A3D; border-radius: 2px; margin-right: 12px; }
.actions { display: flex; justify-content: flex-end; gap: 12px; }
.btn { height: 48px; box-sizing: border-box; padding: 0 20px; margin: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.7px; }
.btn-pri { border: 0; background: #4BE277; color: #003915; }
.btn-sec { background: #132A1F; color: #D4E7DD; border: 1px solid #3D4A3D; }
h2 { margin: 0; font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.body16 { margin: 0; font-size: 16px; line-height: 24px; color: #BCCBB9; }
.note { margin: 0; font-size: 12px; line-height: 16px; color: #869585; }
.hrow { display: flex; align-items: baseline; justify-content: space-between; }
.pcard { background: #0D1F16; border: 1px solid #283831; border-radius: 8px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 16px; }
.prow .grow { flex-grow: 1; }
.pav { width: 40px; height: 40px; box-sizing: border-box; border: 2px solid; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #D4E7DD; flex-shrink: 0; }
.pname { font-size: 16px; line-height: 24px; font-weight: 600; color: #D4E7DD; }
</style>
</head>
