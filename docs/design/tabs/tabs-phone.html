<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs &#8212; phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
/* 411 x 891, the harness's mobile viewport. Toolbar 56; page tabs 8 under it,
   as screenshots/mobile/whatsapp-receipts-sent.png measures for today's strip. Body content is
   drawn as built, from that capture, 36e-printer-bluetooth-first-visit.png and
   small-phone/16k-configs.png - only the strip is redesigned. */
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #D4E7DD; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; flex-wrap: wrap; gap: 32px; padding: 20px 24px 48px; }
.page-stage > figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.page-stage > figure > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
figcaption { font-size: 13px; color: #869585; max-width: 411px; text-align: center; line-height: 19px; }
figcaption b { color: #BCCBB9; font-weight: 600; }

.phone { position: relative; width: 411px; height: 891px; box-sizing: border-box; background: #071610; display: flex; flex-direction: column; overflow: hidden; }
.bar { height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; }
.bar span { font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.body { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
.inset { padding: 0 20px; }
svg.g { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }
svg.g24 { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; }

/* ---- Two tabs: the switch ---- */
.sw { position: relative; display: flex; height: 48px; border-radius: 999px; background: #0D1F16; box-shadow: inset 0 0 0 1px #132A1F; }
.seg { position: relative; flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; margin: 0; padding: 0 20px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #BCCBB9; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; cursor: pointer; outline: none; }
.seg::before { content: ''; position: absolute; inset: 4px; border-radius: 999px; background: transparent; }
.seg.is-on { color: #D4E7DD; }
.seg.is-on::before { background: #283831; box-shadow: inset 0 0 0 1px #3D4A3D; }
.seg:not(.is-on):hover::before { background: rgba(212, 231, 221, 0.08); }
.seg:not(.is-on):active::before { background: rgba(212, 231, 221, 0.12); }
.seg:focus-visible::after { content: ''; position: absolute; inset: 0; border: 2px solid #4BE277; border-radius: 999px; z-index: 2; }
.seg .lbl { position: relative; z-index: 1; display: block; }

/* ---- Three or more: icon tabs ---- */
.it { position: relative; display: flex; height: 48px; box-shadow: inset 0 -1px 0 #132A1F; }
.it.page { padding: 0 8px; }      /* page inset 20 - tab padding 12: the first glyph lines up with the page's text */
.itab { position: relative; flex: 0 0 auto; height: 48px; box-sizing: border-box; margin: 0; padding: 0 12px; border: 0; background: transparent; display: flex; align-items: center; color: #869585; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; cursor: pointer; outline: none; }
.itab::before { content: ''; position: absolute; inset: 4px; border-radius: 8px; background: transparent; }
.itab:hover, .itab:active { color: #BCCBB9; }
.itab:hover::before { background: rgba(212, 231, 221, 0.08); }
.itab:active::before { background: rgba(212, 231, 221, 0.12); }
.itab.is-on, .itab.is-on:hover { color: #4BE277; }
.itab:focus-visible::after { content: ''; position: absolute; inset: 0; border: 2px solid #4BE277; border-radius: 12px; z-index: 2; }
.itab .c { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; }
.itab .c svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.itab.is-on .c::after { content: ''; position: absolute; left: 0; right: 0; bottom: -14px; height: 2px; border-radius: 2px 2px 0 0; background: #4BE277; }
.scroll-wrap { position: relative; box-shadow: inset 0 -1px 0 #132A1F; overflow: hidden; }
.scroll { overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.scroll .it { box-shadow: none; width: max-content; }

/* ---- Body content, as built ---- */
.rows { display: flex; flex-direction: column; padding: 16px 16px 0; }
.r { display: grid; grid-template-columns: 48px 1fr auto; column-gap: 16px; padding: 12px 0; }
.av { width: 48px; height: 48px; border-radius: 50%; background: #132A1F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #BCCBB9; letter-spacing: 0.4px; }
.r .who { font-size: 16px; line-height: 24px; font-weight: 600; color: #D4E7DD; }
.r .st { display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; color: #BCCBB9; white-space: nowrap; overflow: hidden; }
.r .st b { font-weight: 600; }
.r .st .ok { color: #4BE277; }
.r .st .id { font-family: 'Hanken Grotesk'; color: #BCCBB9; overflow: hidden; text-overflow: ellipsis; }
.r .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; line-height: 16px; color: #869585; padding-top: 4px; }

.disc { display: flex; align-items: center; gap: 8px; padding: 12px 12px; margin: 12px 0 0; color: #D4E7DD; font-size: 16px; line-height: 24px; }
.disc .grow { flex-grow: 1; }
.disc svg { color: #BCCBB9; }
.card { margin-top: 8px; padding: 16px; background: #0D1F16; border: 1px solid #283831; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
.card .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card h3 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 500; color: #D4E7DD; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 8px; background: #283831; border: 1px solid #3D4A3D; font-size: 14px; color: #BCCBB9; white-space: nowrap; }
.card p, .hint { margin: 0; font-size: 14px; line-height: 21px; color: #BCCBB9; }
h2 { margin: 0; font-size: 22px; line-height: 30.8px; font-weight: 600; color: #D4E7DD; }
.body16 { margin: 0; font-size: 16px; line-height: 24px; color: #BCCBB9; }
.btn { height: 48px; box-sizing: border-box; padding: 0 16px; margin: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.7px; border: 0; background: #4BE277; color: #003915; align-self: flex-start; }
.callout { display: flex; gap: 12px; padding: 16px; background: rgba(176, 205, 189, 0.10); border: 1px solid rgba(176, 205, 189, 0.30); border-radius: 8px; color: #B0CDBD; font-size: 16px; line-height: 24px; }
.callout span { color: #D4E7DD; }
</style>
</head>
