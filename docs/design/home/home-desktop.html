<!doctype html>
<html lang="en">
<head>

<title>Home &#8212; desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body { margin: 0; background: #071610; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #4BE277; } a:hover { color: #6BFF8F; }
button { font: inherit; }
:focus-visible { outline: 2px solid #4BE277; outline-offset: 2px; }
.page-nav { padding: 20px 24px 0; font-size: 14px; }
.page-nav a { color: #869585; text-decoration: none; }
.page-nav a:hover { color: #4BE277; text-decoration: underline; }
.page-stage { display: flex; justify-content: center; padding: 20px 24px 48px; }
.page-stage > div { box-shadow: 0 24px 60px rgba(3, 17, 11, 0.6); border-radius: 4px; }
.card { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: #132A1F; border: 1px solid #283831; border-radius: 16px; text-align: left; cursor: pointer; }
.card:hover { border-color: #3D4A3D; }
.card-chip { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; position: relative; }
.card-title { font-size: 18px; font-weight: 600; color: #D4E7DD; }
.card-desc { font-size: 13px; line-height: 19px; color: #BCCBB9; }
.stat { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
.stat-head { display: flex; align-items: center; gap: 10px; }
.stat-chip { width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.stat-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #BCCBB9; }
.stat-value { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #D4E7DD; }
.stat-value.money { color: #45F28D; }
.stat-detail { font-size: 12px; color: #869585; }
.vdiv { width: 1px; align-self: stretch; background: linear-gradient(to bottom, transparent, #3D4A3D, transparent); }
</style>
</head>
