.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; background: transparent; border: 0; border-radius: 12px; cursor: pointer; }

.stat { padding: 16px; background: #132A1F; border: 1px solid #283831; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
.stat-head { display: flex; align-items: center; gap: 8px; }

.stat-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #BCCBB9; }
