name: uzapay_print_helper
description: >-
  UzaPay's print helper for Windows. Lets the web till print to USB receipt
  printers through Windows' own driver, and to network receipt printers, which
  a browser cannot reach by itself.
publish_to: none
version: 1.0.4

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.1.4
  win32: ^5.15.0

dev_dependencies:
  test: ^1.25.0
