# **Sized for this machine, which has 15.7GB and rarely 3GB of it free.** The
# previous line asked for -Xmx8G -XX:MaxMetaspaceSize=4G - up to 12GB for the
# daemon alone - and on 2026-09-02 that crashed the daemon outright partway
# through `assembleRelease`: "Native memory allocation (mmap) failed to map
# 32309248 bytes". The pagefile is on C:, C: had 0.2GB free, so there was no
# swap to fall back to either.
#
# A Flutter Android release build does not need 8GB. If a build ever does die
# for heap here, raise -Xmx before anything else, and check C: has room first.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false
