flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/logo.png"
  
  # Android specific
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "images/logo.png"
  
  # Remove alpha channel for iOS (required)
  remove_alpha_ios: true
  
  # Web
  web:
    generate: true
    image_path: "images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  
  # Windows
  windows:
    generate: true
    image_path: "images/logo.png"
    icon_size: 48
  
  # macOS
  macos:
    generate: true
    image_path: "images/logo.png"
